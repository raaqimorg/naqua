version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    labels: ["📦 dependencies"]
    ignore:
      # The current typescript-eslint release rejects TypeScript 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      # Pinned exactly and released together. An upgrade also needs
      # SCALAR_VERSION in src/app.ts updated by hand (see AGENTS.md).
      effect:
        patterns: ["effect", "@effect/*"]
      dev-dependencies:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: ["📦 dependencies", "🧰 tooling"]
